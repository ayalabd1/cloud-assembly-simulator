version: '3.8'

services:
  # Define the FastAPI simulation service
  web:
    # Build the Docker image from the local Dockerfile
    build: .
    # Map port 8000 on the host to port 8000 in the container
    ports:
      - "8000:8000"
    # Load environment variables (MONGO_URL) from the local .env file
    env_file:
      - .env
    # Restart the container automatically if it crashes
    restart: always